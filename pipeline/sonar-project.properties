# QG-01 y QG-02 — Análisis estático con SonarQube (o SonarQube Cloud, gratuito para repos públicos).
# El quality gate asignado al proyecto es "Sonar way" (condiciones sobre código nuevo):
#   - 0 issues nuevas (ratings A en fiabilidad, seguridad y mantenibilidad)
#   - 100 % de security hotspots nuevos revisados
#   - cobertura de código nuevo >= 80 %
#   - duplicación en código nuevo <= 3 %
# sonar.qualitygate.wait hace que el escáner espere el veredicto y falle el job si el gate falla.
sonar.projectKey=ecommerce-flutter-g1-api
sonar.projectName=E-commerce Flutter G1 - API
sonar.sources=src
sonar.tests=test,pipeline/tests
sonar.exclusions=**/node_modules/**,**/coverage/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
